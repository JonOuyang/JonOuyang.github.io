<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Netflix Intro J Renderer</title>
    <style>
        /* BASE STYLES */
        body {
            margin: 0; padding: 0; background: black; overflow: hidden;
            width: 1920px; height: 1080px;
            display: flex; align-items: center; justify-content: center;
        }

        .netflix-intro-wrapper {
          position: fixed;
          inset: 0;
          display: flex;
          justify-content: center;
          align-items: center;
          width: 100%;
          height: 100%;
          background-color: #000000;
          overflow: hidden;
          z-index: 9999;
        }

        /* Main Container — 300x370 for proper J proportions */
        .netflix-n {
          display: block;
          position: relative;
          width: 300px;
          height: 370px;
          overflow: visible;
          animation: zoom-in 3.0s 0.65s cubic-bezier(0.4, 0, 1, 1) forwards, final-fade 0.5s 3.2s forwards;
          transform-origin: 50% 39%;
          will-change: transform;
        }

        /* Ground Shadow — removed, was clipping hook bottom */

        .netflix-n .helper {
          position: absolute;
          background-color: #e40913;
        }

        /* J - Top Bar */
        .netflix-n .helper-1 {
          width: 100%;
          height: 10%;
          left: 0;
          top: 0;
          transform-origin: center;
          animation: j-top-reveal 0.5s 0s ease-out both, j-top-rollback 0.3s 1.1s ease-in forwards;
          z-index: 3;
        }

        /* J - Stem */
        .netflix-n .helper-2 {
          width: 15%;
          height: 62%;
          left: 42.5%;
          top: 0;
          transform-origin: top;
          overflow: hidden;
          animation: j-stem-reveal 0.4s 0s ease-out both, fading-lumieres-box 0.9s 1.1s forwards;
          z-index: 2;
        }

        /* Bottom fade removed — hook undraws naturally now */

        /* J - Full shape (stem + hook as single SVG path = no seam) */
        .netflix-n .helper-3 {
          left: 0;
          top: 0;
          width: 60%;
          height: 100%;
          background-color: transparent;
          overflow: visible;
          transform-origin: 83.3% 0%;
          opacity: 0;
          animation: j-svg-show 0.01s 0.15s forwards, fading-out 0.1s 1.4s forwards;
          z-index: 0;
        }

        /* Progressive stroke draw — follows the curve naturally */
        .netflix-n .helper-3 path {
          stroke-dasharray: 500;
          stroke-dashoffset: 500;
          animation: j-draw 0.5s 0.15s ease-out forwards, j-undraw 0.3s 1.1s ease-in forwards;
        }

        /* ============================================================
           Brush effect — sweeps upward to reveal light beams
           ============================================================ */
        .netflix-n .helper-2 .effect-brush {
          position: absolute;
          width: 100%;
          height: 300%;
          top: 0;
          overflow: hidden;
          animation: brush-moving 1.2s 1.1s forwards;
          z-index: 6;
        }

        .netflix-n .helper-2 .effect-brush::before {
          display: block;
          content: "";
          position: absolute;
          background-color: #e40913;
          width: 100%;
          height: 70%;
          box-shadow: 0px 0px 12px 6px #e40913;
        }

        .netflix-n .helper-2 .effect-brush [class*="fur-"] {
          display: block;
          position: absolute;
          bottom: 10%;
          height: 30%;
        }

        /* Brush Fringes */
        .fur-1  { left: 0%;   width: 4%;  background: linear-gradient(to bottom, #e40913 15%, transparent 80%); }
        .fur-2  { left: 4%;   width: 3%;  background: linear-gradient(to bottom, #e40913 10%, transparent 60%); }
        .fur-3  { left: 7%;   width: 5%;  background: linear-gradient(to bottom, #e40913 37%, transparent 100%); }
        .fur-4  { left: 12%;  width: 4%;  background: linear-gradient(to bottom, #e40913 23%, transparent 100%); }
        .fur-5  { left: 16%;  width: 4%;  background: linear-gradient(to bottom, #e40913 15%, transparent 85%); }
        .fur-6  { left: 20%;  width: 3%;  background: linear-gradient(to bottom, #e40913 27%, transparent 89%); }
        .fur-7  { left: 23%;  width: 4%;  background: linear-gradient(to bottom, #e40913 20%, transparent 100%); }
        .fur-8  { left: 27%;  width: 2%;  background: linear-gradient(to bottom, #e40913 30%, transparent 100%); }
        .fur-9  { left: 29%;  width: 4%;  background: linear-gradient(to bottom, #e40913 35%, transparent 95%); }
        .fur-10 { left: 33%;  width: 4%;  background: linear-gradient(to bottom, #e40913 39%, transparent 95%); }
        .fur-11 { left: 37%;  width: 2%;  background: linear-gradient(to bottom, #e40913 34%, transparent 95%); }
        .fur-12 { left: 39%;  width: 3%;  background: linear-gradient(to bottom, #e40913 22%, transparent 95%); }
        .fur-13 { left: 42%;  width: 6%;  background: linear-gradient(to bottom, #e40913 47%, transparent 100%); }
        .fur-14 { left: 48%;  width: 2%;  background: linear-gradient(to bottom, #e40913 36%, transparent 100%); }
        .fur-15 { left: 50%;  width: 6%;  background: linear-gradient(to bottom, #e40913 29%, transparent 100%); }
        .fur-16 { left: 56%;  width: 3%;  background: linear-gradient(to bottom, #e40913 39%, transparent 95%); }
        .fur-17 { left: 59%;  width: 4%;  background: linear-gradient(to bottom, #e40913 45%, transparent 100%); }
        .fur-18 { left: 63%;  width: 3%;  background: linear-gradient(to bottom, #e40913 34%, transparent 100%); }
        .fur-19 { left: 66%;  width: 4%;  background: linear-gradient(to bottom, #e40913 47%, transparent 100%); }
        .fur-20 { left: 70%;  width: 2%;  background: linear-gradient(to bottom, #e40913 27%, transparent 95%); }
        .fur-21 { left: 72%;  width: 3%;  background: linear-gradient(to bottom, #e40913 37%, transparent 100%); }
        .fur-22 { left: 75%;  width: 2%;  background: linear-gradient(to bottom, #e40913 9%, transparent 100%); }
        .fur-23 { left: 77%;  width: 2%;  background: linear-gradient(to bottom, #e40913 28%, transparent 92%); }
        .fur-24 { left: 79%;  width: 1%;  background: linear-gradient(to bottom, #e40913 37%, transparent 100%); }
        .fur-25 { left: 80%;  width: 2%;  background: linear-gradient(to bottom, #e40913 28%, transparent 100%); }
        .fur-26 { left: 82%;  width: 4%;  background: linear-gradient(to bottom, #e40913 34%, transparent 100%); }
        .fur-27 { left: 86%;  width: 3%;  background: linear-gradient(to bottom, #e40913 21%, transparent 100%); }
        .fur-28 { left: 89%;  width: 5%;  background: linear-gradient(to bottom, #e40913 39%, transparent 100%); }
        .fur-29 { left: 94%;  width: 3%;  background: linear-gradient(to bottom, #e40913 30%, transparent 100%); }
        .fur-30 { left: 97%;  width: 3%;  background: linear-gradient(to bottom, #e40913 25%, transparent 100%); }

        /* ============================================================
           Light Beams — thin distinct colored bars with black gaps
           ============================================================ */
        .netflix-n .helper-2 .effect-lumieres {
          position: absolute;
          width: 100%;
          height: 100%;
          opacity: 0;
          animation: showing-lumieres 0.3s 1.1s forwards;
          z-index: 1;
        }

        .netflix-n .helper-2 .effect-lumieres [class*="lamp-"] {
          position: absolute;
          display: block;
          height: 100%;
          background: linear-gradient(to bottom, transparent 0%, var(--color) 15%, var(--color) 45%, var(--color) 55%, transparent 90%);
        }

        /* Horizontal glow halo around each beam */
        .netflix-n .helper-2 .effect-lumieres [class*="lamp-"]::before {
          content: "";
          position: absolute;
          width: 4px;
          height: 100%;
          left: -1.5px;
          background: linear-gradient(to bottom, transparent 0%, var(--color) 20%, var(--color) 50%, transparent 85%);
          opacity: 0.25;
        }

        /* Lamp positions — pixel-precise, no glow pseudo-elements
           Stem is 45px wide. Each beam is 1px for maximum sharpness.
           Packed in clusters matching GT warm/blue distribution */
        /* Cluster 1 — far left warm (px 3-11) */
        .lamp-1  { --color: #ff2200; left: 3px;  width: 1px; }
        .lamp-2  { --color: #ff4400; left: 5px;  width: 1px; }
        .lamp-3  { --color: #ffaa00; left: 7px;  width: 1px; }
        .lamp-4  { --color: #ffcc33; left: 9px;  width: 1px; }
        .lamp-5  { --color: #ff6600; left: 11px; width: 1px; }
        /* Cluster 2 — warm (px 14-20) */
        .lamp-6  { --color: #ff1100; left: 14px; width: 1px; }
        .lamp-7  { --color: #11cc77; left: 15px; width: 1px; }
        .lamp-8  { --color: #ff2200; left: 17px; width: 1px; }
        .lamp-9  { --color: #ff5588; left: 18px; width: 1px; }
        .lamp-10 { --color: #ffbb00; left: 20px; width: 1px; }
        /* Cluster 3 — center warm (px 22-28) */
        .lamp-11 { --color: #cc3366; left: 22px; width: 1px; }
        .lamp-12 { --color: #ffdd22; left: 23px; width: 1px; }
        .lamp-13 { --color: #ff4400; left: 25px; width: 1px; }
        .lamp-14 { --color: #ff8800; left: 26px; width: 1px; }
        .lamp-15 { --color: #ff1100; left: 28px; width: 1px; }
        /* Cluster 4 — right warm (px 30-35) */
        .lamp-16 { --color: #ff7700; left: 30px; width: 1px; }
        .lamp-17 { --color: #ff0022; left: 31px; width: 1px; }
        .lamp-18 { --color: #ffaa22; left: 33px; width: 1px; }
        .lamp-19 { --color: #ff1133; left: 34px; width: 1px; }
        .lamp-20 { --color: #ff4466; left: 35px; width: 1px; }
        /* Cluster 5 — blue/cyan (px 38-44) */
        .lamp-21 { --color: #1166cc; left: 38px; width: 1px; }
        .lamp-22 { --color: #2299ee; left: 39px; width: 1px; }
        .lamp-23 { --color: #33bbff; left: 40px; width: 1px; }
        .lamp-24 { --color: #44ddff; left: 41px; width: 1px; }
        .lamp-25 { --color: #22aaff; left: 42px; width: 1px; }
        .lamp-26 { --color: #1188ee; left: 43px; width: 1px; }
        .lamp-27 { --color: #0066dd; left: 44px; width: 1px; }
        .lamp-28 { --color: #ff3300; left: 24px; width: 1px; }
        .lamp-29 { --color: #ff8800; left: 4px;  width: 1px; }

        /* Odd lamps drift left */
        .lamp-1,  .lamp-3,  .lamp-5,  .lamp-7,  .lamp-9,  .lamp-11, .lamp-13,
        .lamp-15, .lamp-17, .lamp-19, .lamp-21, .lamp-23, .lamp-25, .lamp-27, .lamp-29 {
          animation: drift-left 2.4s 1.1s linear forwards;
        }

        /* Even lamps drift right */
        .lamp-2,  .lamp-4,  .lamp-6,  .lamp-8,  .lamp-10, .lamp-12, .lamp-14,
        .lamp-16, .lamp-18, .lamp-20, .lamp-22, .lamp-24, .lamp-26, .lamp-28 {
          animation: drift-right 2.4s 1.1s linear forwards;
        }

        /* ============================================================
           Keyframes
           ============================================================ */
        @keyframes j-top-reveal {
          0% { transform: scaleX(0); opacity: 0; }
          100% { transform: scaleX(1); opacity: 1; }
        }

        @keyframes j-stem-reveal {
          0% { transform: scaleY(0); opacity: 0; }
          100% { transform: scaleY(1); opacity: 1; }
        }

        @keyframes j-svg-show {
          to { opacity: 1; }
        }

        @keyframes j-draw {
          to { stroke-dashoffset: 0; }
        }

        @keyframes j-undraw {
          from { stroke-dashoffset: 0; }
          to { stroke-dashoffset: 500; }
        }

        @keyframes j-top-rollback {
          0% { transform: scaleX(1); opacity: 1; }
          100% { transform: scaleX(0); opacity: 0; }
        }

        @keyframes zoom-in {
          0%   { transform: scale(1); }
          20%  { transform: scale(1.15); }
          35%  { transform: scale(1.5); }
          50%  { transform: scale(4); }
          65%  { transform: scale(12); }
          80%  { transform: scale(40); }
          100% { transform: scale(120); }
        }

        @keyframes brush-moving {
          0%   { transform: translateY(0); }
          100% { transform: translateY(-100%); }
        }

        @keyframes showing-lumieres {
          0% { opacity: 0; }
          100% { opacity: 1; }
        }

        @keyframes fading-lumieres-box {
          0% { background-color: #e40913; }
          100% { background-color: transparent; }
        }

        @keyframes fading-out {
          0% { opacity: 1; }
          100% { opacity: 0; }
        }

        @keyframes final-fade {
          0% { opacity: 1; }
          100% { opacity: 0; }
        }

        @keyframes drift-left {
          0%   { transform: translateX(0); }
          100% { transform: translateX(-25px); }
        }

        @keyframes drift-right {
          0%   { transform: translateX(0); }
          100% { transform: translateX(25px); }
        }

        /* RENDERER OVERRIDES */
        * { animation-play-state: paused !important; }
    </style>
</head>
<body>
    <div class="netflix-intro-wrapper">
        <div class="netflix-n">
            <!-- Top Bar -->
            <div class="helper helper-1"></div>

            <!-- Stem with brush + light beams -->
            <div class="helper helper-2">
                <div class="effect-brush">
                    <span class="fur-30"></span><span class="fur-29"></span><span class="fur-28"></span><span class="fur-27"></span><span class="fur-26"></span><span class="fur-25"></span><span class="fur-24"></span><span class="fur-23"></span><span class="fur-22"></span><span class="fur-21"></span><span class="fur-20"></span><span class="fur-19"></span><span class="fur-18"></span><span class="fur-17"></span><span class="fur-16"></span><span class="fur-15"></span><span class="fur-14"></span><span class="fur-13"></span><span class="fur-12"></span><span class="fur-11"></span><span class="fur-10"></span><span class="fur-9"></span><span class="fur-8"></span><span class="fur-7"></span><span class="fur-6"></span><span class="fur-5"></span><span class="fur-4"></span><span class="fur-3"></span><span class="fur-2"></span><span class="fur-1"></span>
                </div>
                <div class="effect-lumieres">
                    <span class="lamp-1"></span><span class="lamp-2"></span><span class="lamp-3"></span><span class="lamp-4"></span><span class="lamp-5"></span><span class="lamp-6"></span><span class="lamp-7"></span><span class="lamp-8"></span><span class="lamp-9"></span><span class="lamp-10"></span><span class="lamp-11"></span><span class="lamp-12"></span><span class="lamp-13"></span><span class="lamp-14"></span><span class="lamp-15"></span><span class="lamp-16"></span><span class="lamp-17"></span><span class="lamp-18"></span><span class="lamp-19"></span><span class="lamp-20"></span><span class="lamp-21"></span><span class="lamp-22"></span><span class="lamp-23"></span><span class="lamp-24"></span><span class="lamp-25"></span><span class="lamp-26"></span><span class="lamp-27"></span><span class="lamp-28"></span><span class="lamp-29"></span>
                </div>
            </div>

            <!-- Full J shape (stem + hook as single path = no seam) -->
            <svg class="helper helper-3" viewBox="0 0 180 370" fill="none">
                <path d="M 150 0 V 250 Q 150 350 25 350" stroke="#e40913" stroke-width="45" stroke-linecap="butt"/>
            </svg>
        </div>
    </div>

    <script>
        window.seekTo = (timeInSeconds) => {
            const timeInMs = timeInSeconds * 1000;
            document.getAnimations().forEach(anim => {
                anim.currentTime = timeInMs;
            });
        };
    </script>
</body>
</html>
